{{- if .Values.backend.externalSecret.enabled }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "webapp.fullname" . }}-eso-reader
  labels:
    {{- include "webapp.labels" . | nindent 4 }}
# ESO requests its own short-lived token for this account; no pod mounts it.
automountServiceAccountToken: false
{{- end }}
