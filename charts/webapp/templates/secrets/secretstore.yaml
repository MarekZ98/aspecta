{{- with .Values.backend.externalSecret }}
{{- if .enabled }}
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: {{ include "webapp.fullname" $ }}-secrets-store
  labels:
    {{- include "webapp.labels" $ | nindent 4 }}
  annotations:
    {{- include "webapp.crdSyncOptions" $ | nindent 4 }}
spec:
  provider:
    kubernetes:
      remoteNamespace: {{ .remoteNamespace }}
      server:
        caProvider:
          type: ConfigMap
          name: kube-root-ca.crt
          key: ca.crt
      auth:
        serviceAccount:
          name: {{ include "webapp.fullname" $ }}-eso-reader
{{- end }}
{{- end }}
