{{- with .Values.backend.externalSecret }}
{{- if .enabled }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ include "webapp.fullname" $ }}-backend
  labels:
    {{- include "webapp.componentLabels" (dict "root" $ "component" "backend") | nindent 4 }}
  annotations:
    {{- include "webapp.crdSyncOptions" $ | nindent 4 }}
spec:
  refreshInterval: {{ .refreshInterval }}
  secretStoreRef:
    kind: SecretStore
    name: {{ include "webapp.fullname" $ }}-secrets-store
  target:
    name: {{ include "webapp.fullname" $ }}-backend-secrets
    creationPolicy: Owner
  data:
    - secretKey: ADMIN_TOKEN
      remoteRef:
        key: {{ .remoteKey }}
        property: ADMIN_TOKEN
{{- end }}
{{- end }}
