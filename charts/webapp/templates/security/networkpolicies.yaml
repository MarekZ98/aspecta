{{- if .Values.networkPolicy.enabled }}
{{- $frontend := include "webapp.componentSelectorLabels" (dict "root" $ "component" "frontend") }}
{{- $backend := include "webapp.componentSelectorLabels" (dict "root" $ "component" "backend") }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-all
  labels:
    {{- include "webapp.labels" . | nindent 4 }}
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dns-egress
  labels:
    {{- include "webapp.labels" . | nindent 4 }}
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: frontend-ingress
  labels:
    {{- include "webapp.componentLabels" (dict "root" $ "component" "frontend") | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- $frontend | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.networkPolicy.ingressControllerNamespace }}
      ports:
        - protocol: TCP
          port: {{ .Values.frontend.port }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: frontend-egress
  labels:
    {{- include "webapp.componentLabels" (dict "root" $ "component" "frontend") | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- $frontend | nindent 6 }}
  policyTypes:
    - Egress
  egress:
    - to:
        - podSelector:
            matchLabels:
              {{- $backend | nindent 14 }}
      ports:
        - protocol: TCP
          port: {{ .Values.backend.port }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: backend-ingress
  labels:
    {{- include "webapp.componentLabels" (dict "root" $ "component" "backend") | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- $backend | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{- $frontend | nindent 14 }}
      ports:
        - protocol: TCP
          port: {{ .Values.backend.port }}
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.networkPolicy.monitoringNamespace }}
          podSelector:
            matchLabels:
              app.kubernetes.io/name: prometheus
      ports:
        - protocol: TCP
          port: {{ .Values.backend.metricsPort }}
{{- end }}
