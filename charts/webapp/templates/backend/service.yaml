apiVersion: v1
kind: Service
metadata:
  name: {{ include "webapp.fullname" . }}-backend
  labels:
    {{- include "webapp.componentLabels" (dict "root" $ "component" "backend") | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "webapp.componentSelectorLabels" (dict "root" $ "component" "backend") | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.backend.port }}
      targetPort: http
      protocol: TCP
    - name: metrics
      port: {{ .Values.backend.metricsPort }}
      targetPort: metrics
      protocol: TCP
