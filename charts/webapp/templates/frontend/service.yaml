apiVersion: v1
kind: Service
metadata:
  name: {{ include "webapp.fullname" . }}-frontend
  labels:
    {{- include "webapp.componentLabels" (dict "root" $ "component" "frontend") | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "webapp.componentSelectorLabels" (dict "root" $ "component" "frontend") | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.frontend.port }}
      targetPort: http
      protocol: TCP
