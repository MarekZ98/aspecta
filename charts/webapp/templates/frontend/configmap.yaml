apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "webapp.fullname" . }}-frontend-config
  labels:
    {{- include "webapp.componentLabels" (dict "root" $ "component" "frontend") | nindent 4 }}
data:
  config.json: {{ .Values.frontend.runtimeConfig | toJson | quote }}
  default.conf: |
    server {
      listen {{ .Values.frontend.port }};
      server_name _;
      root /usr/share/nginx/html;
      server_tokens off;

{{ include "webapp.frontend.securityHeaders" . | indent 6 }}

      location = /nginx-health { access_log off; default_type text/plain; return 200 "ok\n"; }

      location /api/ {
        proxy_pass http://{{ include "webapp.backendHost" . }}:{{ .Values.backend.port }};
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Request-Id $request_id;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 2s;
        proxy_read_timeout 10s;
      }

      location = /config.json {
        add_header Cache-Control "no-store" always;
        {{- include "webapp.frontend.securityHeaders" . | nindent 8 }}
      }

      location = /index.html {
        add_header Cache-Control "no-store" always;
        {{- include "webapp.frontend.securityHeaders" . | nindent 8 }}
      }

      location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        {{- include "webapp.frontend.securityHeaders" . | nindent 8 }}
      }

      location / { try_files $uri /index.html; }
    }
