{{- with .Values.ingress }}
{{- if .enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "webapp.fullname" $ }}
  labels:
    {{- include "webapp.labels" $ | nindent 4 }}
spec:
  ingressClassName: {{ .className }}
  {{- if .tls.enabled }}
  tls:
    - hosts:
        - {{ .host | quote }}
      secretName: {{ .tls.secretName }}
  {{- end }}
  rules:
    - host: {{ .host | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "webapp.fullname" $ }}-frontend
                port:
                  name: http
{{- end }}
{{- end }}
