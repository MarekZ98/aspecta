{{- with .Values.guardrails }}
{{- if .enabled }}
apiVersion: v1
kind: ResourceQuota
metadata:
  name: {{ include "webapp.fullname" $ }}-quota
  labels:
    {{- include "webapp.labels" $ | nindent 4 }}
spec:
  hard:
    requests.cpu: {{ .quota.requestsCpu | quote }}
    requests.memory: {{ .quota.requestsMemory | quote }}
    limits.cpu: {{ .quota.limitsCpu | quote }}
    limits.memory: {{ .quota.limitsMemory | quote }}
    pods: {{ .quota.pods | quote }}
---
apiVersion: v1
kind: LimitRange
metadata:
  name: {{ include "webapp.fullname" $ }}-limits
  labels:
    {{- include "webapp.labels" $ | nindent 4 }}
spec:
  limits:
    - type: Container
      default:
        {{- toYaml .defaultLimits | nindent 8 }}
      defaultRequest:
        {{- toYaml .defaultRequests | nindent 8 }}
{{- end }}
{{- end }}
