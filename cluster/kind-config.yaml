kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: aspecta
networking:
  # Calico is installed by bootstrap.sh; nodes stay NotReady until then.
  disableDefaultCNI: true
  podSubnet: 192.168.0.0/16
nodes:
  - role: control-plane
    labels:
      ingress-ready: "true"
    extraPortMappings:
      - containerPort: 30080
        hostPort: 80
        listenAddress: 127.0.0.1
        protocol: TCP
      - containerPort: 30443
        hostPort: 443
        listenAddress: 127.0.0.1
        protocol: TCP
  - role: worker
  - role: worker
