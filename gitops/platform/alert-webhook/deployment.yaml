apiVersion: apps/v1
kind: Deployment
metadata:
  name: alert-webhook
  labels:
    app.kubernetes.io/name: alert-webhook
    app.kubernetes.io/part-of: aspecta
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: alert-webhook
  template:
    metadata:
      labels:
        app.kubernetes.io/name: alert-webhook
        app.kubernetes.io/part-of: aspecta
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: echo
          image: mendhak/http-https-echo:43
          env:
            - name: HTTP_PORT
              value: "8080"
            - name: HTTPS_PORT
              value: "8443"
            # Keep the log readable: only alert payloads, no probe requests.
            - name: LOG_IGNORE_PATH
              value: /healthz
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
