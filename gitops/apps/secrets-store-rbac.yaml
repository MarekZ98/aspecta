apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: secrets-store-rbac
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: platform
  source:
    repoURL: https://github.com/MarekZ98/aspecta.git
    targetRevision: main
    path: gitops/platform/secrets-store
  destination:
    server: https://kubernetes.default.svc
    namespace: secrets-store
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      limit: 10
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
    syncOptions:
      - CreateNamespace=true
